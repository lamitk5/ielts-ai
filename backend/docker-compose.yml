services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ielts-ai-tutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RAG_DB_NAME:-ielts_ai_tutor}
      POSTGRES_USER: ${RAG_DB_USER:-ielts}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-ielts_dev_password}
    ports:
      - "${RAG_DB_PORT:-5432}:5432"
    volumes:
      - ./data/rag/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
