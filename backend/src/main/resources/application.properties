spring.application.name=ielts-ai-tutor-backend
server.port=${PORT:8080}
google.gemini.api-key=${GEMINI_API_KEY:}
google.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
google.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
google.gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:3s}
google.gemini.response-timeout=${GEMINI_RESPONSE_TIMEOUT:20s}
google.gemini.max-retries=${GEMINI_MAX_RETRIES:1}
google.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:}
ai.primary-provider=${AI_PRIMARY_PROVIDER:GROQ}
ai.fallback-providers=${AI_FALLBACK_PROVIDERS:CLOUDFLARE,GEMINI}
ai.health.transient-failure-threshold=${AI_HEALTH_TRANSIENT_FAILURE_THRESHOLD:3}
ai.health.rolling-window=${AI_HEALTH_ROLLING_WINDOW:60s}
ai.health.cooldown=${AI_HEALTH_COOLDOWN:30s}
ai.health.half-open-probes=${AI_HEALTH_HALF_OPEN_PROBES:1}
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.chat-model=${GROQ_CHAT_MODEL:}
ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
ai.groq.connect-timeout=${GROQ_CONNECT_TIMEOUT:3s}
ai.groq.response-timeout=${GROQ_RESPONSE_TIMEOUT:20s}
ai.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
ai.cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
ai.cloudflare.chat-model=${CLOUDFLARE_CHAT_MODEL:}
ai.cloudflare.embedding-model=${CLOUDFLARE_EMBEDDING_MODEL:}
ai.cloudflare.base-url=${CLOUDFLARE_BASE_URL:https://api.cloudflare.com/client/v4/accounts}
ai.cloudflare.connect-timeout=${CLOUDFLARE_CONNECT_TIMEOUT:3s}
ai.cloudflare.response-timeout=${CLOUDFLARE_RESPONSE_TIMEOUT:20s}
rag.embedding-dimension=${RAG_EMBEDDING_DIMENSION:768}
rag.admin-token=${RAG_ADMIN_TOKEN:}
rag.cli=${RAG_CLI:}
rag.manifest=${RAG_MANIFEST:backend/rag-data/manifest.yml}
spring.datasource.url=${RAG_DB_URL:jdbc:postgresql://${RAG_DB_HOST:localhost}:${RAG_DB_PORT:5432}/${RAG_DB_NAME:ielts_ai_tutor}}
spring.datasource.username=${RAG_DB_USER:ielts}
spring.datasource.password=${RAG_DB_PASSWORD:ielts_dev_password}
spring.flyway.enabled=${RAG_FLYWAY_ENABLED:true}
spring.jpa.hibernate.ddl-auto=none
rag.storage-root=${RAG_STORAGE_ROOT:backend/data/rag/uploads}
rag.max-upload-bytes=${RAG_MAX_UPLOAD_BYTES:10485760}
rag.embedding-dimension=${RAG_EMBEDDING_DIMENSION:768}
rag.top-k=${RAG_TOP_K:5}
rag.min-similarity=${RAG_MIN_SIMILARITY:0.72}
rag.embedding-batch-size=${RAG_EMBEDDING_BATCH_SIZE:32}
