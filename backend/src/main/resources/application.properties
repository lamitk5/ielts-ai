spring.application.name=ielts-ai-tutor-backend
server.port=${PORT:8080}
google.gemini.api-key=${GEMINI_API_KEY:}
google.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
google.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
google.gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:3s}
google.gemini.response-timeout=${GEMINI_RESPONSE_TIMEOUT:20s}
google.gemini.max-retries=${GEMINI_MAX_RETRIES:1}
spring.datasource.url=${RAG_DB_URL:jdbc:postgresql://${RAG_DB_HOST:localhost}:${RAG_DB_PORT:5432}/${RAG_DB_NAME:ielts_ai_tutor}}
spring.datasource.username=${RAG_DB_USER:ielts}
spring.datasource.password=${RAG_DB_PASSWORD:ielts_dev_password}
spring.flyway.enabled=${RAG_FLYWAY_ENABLED:true}
spring.jpa.hibernate.ddl-auto=none
rag.storage-root=${RAG_STORAGE_ROOT:backend/data/rag/uploads}
rag.max-upload-bytes=${RAG_MAX_UPLOAD_BYTES:10485760}
rag.embedding-dimension=${RAG_EMBEDDING_DIMENSION:768}
rag.top-k=${RAG_TOP_K:5}
rag.min-similarity=${RAG_MIN_SIMILARITY:0.72}
rag.embedding-batch-size=${RAG_EMBEDDING_BATCH_SIZE:32}
