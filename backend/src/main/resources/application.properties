spring.application.name=ielts-ai-tutor-backend
server.port=${PORT:8080}
google.gemini.api-key=${GEMINI_API_KEY:}
google.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
google.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
google.gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:3s}
google.gemini.response-timeout=${GEMINI_RESPONSE_TIMEOUT:20s}
google.gemini.max-retries=${GEMINI_MAX_RETRIES:1}
